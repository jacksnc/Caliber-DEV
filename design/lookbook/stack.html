<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helios Stack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Nunito:wght@600;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="look.css">
<style>html, body { margin: 0; }</style>
</head>
<body>
<div class="hx hx-screen" data-theme="dark">
  <div class="hx-body">
    <header class="hx-head">
      <h1 class="t-display">Stack</h1>
      <button class="icon-btn glass raised" aria-label="Profile and settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></button>
    </header>

    <section class="glass card" aria-label="Doses today">
      <div class="card-h">
        <h2 class="t-section">Doses today</h2>
        <p class="t-foot c-2 num">Now 9:12 AM</p>
      </div>
      <ul class="stackv" style="gap:8px">
        <li class="glass raised tile" style="gap:10px">
          <div class="row">
            <span class="avatar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3.5h5M10.5 3.5v5.2L6.6 17a2.6 2.6 0 0 0 2.4 3.6h6a2.6 2.6 0 0 0 2.4-3.6l-3.9-8.3V3.5"/><path d="M8.4 14.5h7.2"/></svg></span>
            <div class="stackv grow">
              <h3 class="t-strong">Semaglutide</h3>
              <p class="t-foot c-2 num">0.5 mg · weekly · planned 8:00 AM</p>
            </div>
          </div>
          <span class="badge warn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path class="ico-fill" d="M12 4l9 16H3z"/><path class="ink" d="M12 10v4.2M12 17v.01"/></svg>Overdue by 1 h 12 min</span>
          <div class="row">
            <button class="btn primary compact grow">Log dose</button>
            <button class="btn compact glass raised">Skip</button>
          </div>
        </li>
        <li class="list-row">
          <span class="avatar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3.5h5M10.5 3.5v5.2L6.6 17a2.6 2.6 0 0 0 2.4 3.6h6a2.6 2.6 0 0 0 2.4-3.6l-3.9-8.3V3.5"/><path d="M8.4 14.5h7.2"/></svg></span>
          <div class="stackv grow">
            <h3 class="t-strong">BPC-157</h3>
            <p class="t-foot c-2 num">250 mcg · twice daily</p>
          </div>
          <span class="badge neutral"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>8:30 PM</span>
        </li>
        <li class="list-row">
          <span class="avatar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="M12 8.5v7" transform="rotate(-45 12 12)"/></svg></span>
          <div class="stackv grow">
            <h3 class="t-strong">Creatine</h3>
            <p class="t-foot c-2 num">5 g · daily</p>
          </div>
          <span class="badge ok"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle class="ico-fill" cx="12" cy="12" r="9.5"/><path class="ink" d="M7.8 12.4l3 3 5.4-6"/></svg>Taken 7:40 AM</span>
        </li>
      </ul>
    </section>

    <section class="glass card" aria-label="Active level">
      <div class="card-h">
        <h2 class="t-section">Semaglutide level</h2>
        <span class="badge neutral">Estimate · mg</span>
      </div>
      <svg class="chart" viewBox="0 0 326 100" role="img" aria-label="Estimated active level of semaglutide over four weeks, about 0.5 milligrams now, rising to about 0.8 if today's dose is logged">
        <path class="grid" d="M34,76 H322"/><text class="axis-t" x="0" y="80">0</text>
        <path class="grid" d="M34,42 H322"/><text class="axis-t" x="0" y="46">0.5</text>
        <path class="grid" d="M34,8 H322"/><text class="axis-t" x="0" y="12">1.0</text>
        <path class="f-peptide" fill-opacity="0.1" d="M34,76 L37.9,67.4 L41.7,61.3 L45.6,57.1 L49.4,54.2 L53.3,52.4 L57.1,51.4 L61,50.8 L64.9,50.7 L68.7,50.8 L72.6,51.2 L76.4,51.6 L80.3,52.2 L84.1,52.8 L88,53.5 L91.9,54.2 L95.7,54.9 L99.6,55.6 L103.4,56.3 L107.3,53.8 L111.1,46.7 L115,42 L118.9,38.9 L122.7,37.1 L126.6,36.1 L130.4,35.8 L134.3,36 L138.1,36.5 L142,37.2 L145.9,38.1 L149.7,39.1 L153.6,40.1 L157.4,41.2 L161.3,42.3 L165.1,43.5 L169,44.6 L172.9,45.6 L176.7,46.7 L180.6,41.6 L184.4,35.8 L188.3,32 L192.1,29.7 L196,28.5 L199.9,28.1 L203.7,28.3 L207.6,28.8 L211.4,29.7 L215.3,30.7 L219.1,31.9 L223,33.1 L226.9,34.4 L230.7,35.8 L234.6,37.1 L238.4,38.4 L242.3,39.7 L246.1,41 L250,42.2 L250.5,42.4 L250.5,76 L34,76 Z"/>
        <path class="ln s-peptide" d="M34,76 L37.9,67.4 L41.7,61.3 L45.6,57.1 L49.4,54.2 L53.3,52.4 L57.1,51.4 L61,50.8 L64.9,50.7 L68.7,50.8 L72.6,51.2 L76.4,51.6 L80.3,52.2 L84.1,52.8 L88,53.5 L91.9,54.2 L95.7,54.9 L99.6,55.6 L103.4,56.3 L107.3,53.8 L111.1,46.7 L115,42 L118.9,38.9 L122.7,37.1 L126.6,36.1 L130.4,35.8 L134.3,36 L138.1,36.5 L142,37.2 L145.9,38.1 L149.7,39.1 L153.6,40.1 L157.4,41.2 L161.3,42.3 L165.1,43.5 L169,44.6 L172.9,45.6 L176.7,46.7 L180.6,41.6 L184.4,35.8 L188.3,32 L192.1,29.7 L196,28.5 L199.9,28.1 L203.7,28.3 L207.6,28.8 L211.4,29.7 L215.3,30.7 L219.1,31.9 L223,33.1 L226.9,34.4 L230.7,35.8 L234.6,37.1 L238.4,38.4 L242.3,39.7 L246.1,41 L250,42.2 L250.5,42.4"/>
        <path class="ln s-peptide" stroke-opacity="0.45" d="M250.5,42.4 L253.9,35.7 L257.7,30.5 L261.6,27.2 L265.4,25.3 L269.3,24.5 L273.1,24.3 L277,24.7 L280.9,25.5 L284.7,26.5 L288.6,27.7 L292.4,29 L296.3,30.4 L300.1,31.8 L304,33.2 L307.9,34.7 L311.7,36.1 L315.6,37.4 L319.4,38.8 L322,39.7"/>
        <circle class="f-peptide pt-ring" cx="250.5" cy="42.4" r="5"/>
        <text class="axis-t" x="243" y="21" text-anchor="end">Now ≈ 0.5 mg</text>
        <text class="axis-t" x="322" y="62" text-anchor="end">If logged now</text>
        <text class="axis-t" x="28" y="96" text-anchor="start">Oct 3</text>
        <text class="axis-t" x="106" y="96" text-anchor="middle">Oct 10</text>
        <text class="axis-t" x="178" y="96" text-anchor="middle">Oct 17</text>
        <text class="axis-t" x="250" y="96" text-anchor="middle">Oct 24</text>
        <text class="axis-t" x="324" y="96" text-anchor="end">Oct 31</text>
      </svg>
    </section>

    <section class="glass raised tile" aria-label="Pen supply">
      <div class="row" style="justify-content:space-between">
        <span class="t-callout">Semaglutide pen</span>
        <span class="t-callout num"><b>3</b> <span class="c-2">of 4 doses left</span></span>
      </div>
      <div class="meter" role="meter" aria-label="Doses left" aria-valuemin="0" aria-valuemax="4" aria-valuenow="3"><i style="width:75%"></i></div>
    </section>
  </div>

  <nav class="tabbar glass overlay" aria-label="Main">
    <button class="tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></svg><span class="t-tab">Today</span></button>
    <button class="tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span class="t-tab">Train</span></button>
    <button class="tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5h16a8 8 0 0 1-16 0z"/><path d="M9 7.5c0-1.6 1-2.6 2.2-3M14.5 7.5c0-1.4.8-2.3 1.8-2.8"/></svg><span class="t-tab">Fuel</span></button>
    <button class="tab" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3.5h5M10.5 3.5v5.2L6.6 17a2.6 2.6 0 0 0 2.4 3.6h6a2.6 2.6 0 0 0 2.4-3.6l-3.9-8.3V3.5"/><path d="M8.4 14.5h7.2"/></svg><span class="t-tab">Stack</span></button>
    <button class="tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14.5h16"/><path d="M8 14.5l3.4-4.2 3 2.6 4.6-6"/></svg><span class="t-tab">Progress</span></button>
  </nav>
  <button class="fab" aria-label="Quick log"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<script src="theme.js"></script>
</body>
</html>
